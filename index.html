    <style>*{box-sizing:border-box}
:root{color-scheme:light;--paper:#fff8ef;--surface:#fffdf9;--surface-2:#fff0df;--ink:#281b2b;--muted:#655761;--line:#35253a;--soft-line:#eadbd4;--accent:#ef4f82;--accent-ink:#281b2b;--accent-soft:#ffe0eb;--secondary:#ffca3a;--tertiary:#20b99b;--blue:#396dff;--danger:#d94040;--shadow:0 8px 22px rgba(55,34,45,.09);--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--radius:14px;--focus:0 0 0 3px rgba(57,109,255,.28)}
body{margin:0;height:100vh;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;transition:background-color .28s ease,color .28s ease;accent-color:var(--accent)}
body[data-theme="dopamine"]{--paper:#fff3fc;--surface:#fffaff;--surface-2:#fbe3ff;--ink:#281032;--muted:#62416e;--line:#341444;--soft-line:#ebc9f0;--accent:#e936d8;--accent-ink:#281032;--accent-soft:#f9d9f4;--secondary:#ffe43b;--tertiary:#23d5e8;--blue:#414fff}
body[data-theme="citrus"]{--paper:#f7fbdc;--surface:#fffef3;--surface-2:#edf5bb;--ink:#283017;--muted:#56613a;--line:#37421f;--soft-line:#d9dfb3;--accent:#ff7042;--accent-ink:#283017;--accent-soft:#ffe0d1;--secondary:#d9f249;--tertiary:#16a995;--blue:#3768e8}
body[data-theme="blueprint"]{--paper:#eaf1ff;--surface:#fcfdff;--surface-2:#dbe9ff;--ink:#172746;--muted:#455978;--line:#243958;--soft-line:#c6d5ed;--accent:#315de8;--accent-ink:#fff;--accent-soft:#dce6ff;--secondary:#ffcc45;--tertiary:#14a995;--blue:#315de8}
body[data-theme="night"]{color-scheme:dark;--paper:#191526;--surface:#241e33;--surface-2:#30263e;--ink:#fff7ef;--muted:#d2c1d0;--line:#f5d8e8;--soft-line:#4a3a50;--accent:#ff5795;--accent-ink:#251328;--accent-soft:#49253e;--secondary:#f5d64b;--tertiary:#62e2bd;--blue:#82a5ff;--shadow:0 10px 26px rgba(0,0,0,.26);--focus:0 0 0 3px rgba(130,165,255,.4)}
body[data-theme="monochrome"]{color-scheme:light;--paper:#f2f2f0;--surface:#fff;--surface-2:#e9e9e7;--ink:#171717;--muted:#5d5d5b;--line:#252525;--soft-line:#d2d2d0;--accent:#181818;--accent-ink:#fff;--accent-soft:#ededeb;--secondary:#e2e2e0;--tertiary:#d8d8d6;--blue:#292929;--shadow:0 8px 22px rgba(0,0,0,.07);--focus:0 0 0 3px rgba(20,20,20,.22)}
::selection{background:var(--accent);color:var(--accent-ink)}:focus-visible{outline:0;box-shadow:var(--focus)}
button,select,input{font:inherit;color:inherit}
button,select{min-height:36px;border:1.5px solid var(--soft-line);border-radius:9px;background:var(--surface);padding:7px 11px;cursor:pointer;transition:transform .16s ease,background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease}
button:hover,select:hover{border-color:var(--line);background:var(--surface-2)}button:active{transform:translateY(1px) scale(.985)}button:disabled,select:disabled{opacity:.48;cursor:not-allowed}
#instance-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(20,12,26,.64);padding:20px}
#instance-overlay .message{max-width:450px;padding:34px;background:var(--surface);border:2px solid var(--line);border-radius:18px;box-shadow:var(--shadow);text-align:center}
#instance-overlay .message h2{margin:0 0 12px;font-size:23px;line-height:1.2}#instance-overlay .message p{margin:0 0 20px;color:var(--muted)}
#instance-overlay .message .close-btn,.btn-primary{background:var(--accent);border-color:var(--line);color:var(--accent-ink);font-weight:750}
#instance-overlay .message .close-btn:hover,.btn-primary:hover{filter:brightness(.96)}
.workspace-switcher{z-index:12;display:flex;flex:0 0 auto;gap:10px;padding:14px 22px 10px;background:var(--paper)}
.workspace-switch{position:relative;min-width:140px;min-height:46px;padding:8px 18px;border:2px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:800;letter-spacing:.01em;box-shadow:0 3px 8px rgba(40,27,43,.13)}
.workspace-switch:nth-child(2){background:var(--secondary)}.workspace-switch.active{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 12px rgba(40,27,43,.17);transform:translateY(-1px)}.workspace-switch:hover{filter:saturate(1.15)}
.toolbar{z-index:10;display:flex;flex:0 0 auto;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:9px 22px;background:var(--surface);border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.tool-group{display:flex;flex:0 0 auto;align-items:center;gap:6px;padding:4px 6px;border:1.5px solid var(--soft-line);border-radius:11px;background:var(--surface)}
.tool-group label{padding:0 4px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.03em}.toolbar select{max-width:150px;min-height:34px;padding:5px 9px;font-size:12px;font-weight:650}
.toolbar .toolbar-action{min-height:34px;padding:6px 10px;font-size:12px;font-weight:700}.toolbar .style-toggle[aria-pressed="true"]{background:var(--secondary);border-color:var(--line);color:var(--ink)}
.toolbar .separator{height:28px;width:2px;background:var(--soft-line)}.toolbar>div:last-child{margin-left:auto;color:var(--muted)!important;font-size:11px!important}
.color-orange,.color-blue,.color-black,.color-deep-purple{min-width:34px;padding:5px 9px;font-weight:800}.color-orange{background:#ffe1d2!important;color:#8c3517!important}.color-blue{background:#dce6ff!important;color:#2546a1!important}.color-black{background:#302538!important;color:#fff!important}.color-deep-purple{background:#eadcff!important;color:#58358a!important}
body[data-theme="night"] .color-orange{background:#573222!important;color:#ffd0b9!important}body[data-theme="night"] .color-blue{background:#263a6c!important;color:#dce6ff!important}body[data-theme="night"] .color-black{background:#130f1b!important;color:#fff!important}body[data-theme="night"] .color-deep-purple{background:#402752!important;color:#edd9ff!important}
.app-container{display:flex;flex:1;min-height:0;overflow:hidden;gap:14px;padding:12px 22px 18px;background:var(--paper)}
.category-sidebar{display:flex;flex:0 0 164px;flex-direction:column;min-width:0;overflow:hidden;padding:10px 8px;border:2px solid var(--line);border-radius:var(--radius);background:var(--secondary);box-shadow:var(--shadow)}
.category-sidebar-header{padding:2px 0 8px}.categories-list{display:flex;flex:1;min-height:0;flex-direction:column;gap:5px;overflow-y:auto;padding:0 1px}
.category-item{position:relative;display:flex;align-items:center;min-height:38px;padding:7px 9px;border:1.5px solid transparent;border-radius:8px;color:var(--ink);font-size:12px;font-weight:700;cursor:pointer;transition:background .18s ease,transform .18s ease}
.category-item:hover{background:rgba(255,255,255,.55);transform:translateX(2px)}.category-item.active{border-color:var(--line);background:var(--surface);box-shadow:0 3px 8px rgba(40,27,43,.14)}.category-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.category-empty{padding:9px;color:var(--muted);font-size:12px}
.docs-sidebar{display:flex;flex:0 0 234px;flex-direction:column;min-width:0;overflow:hidden;padding:10px 9px;border:2px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.sidebar-header{display:flex;flex:0 0 auto;flex-direction:column;gap:8px;padding:0 0 10px;border-bottom:1.5px solid var(--soft-line)}
.add-doc-btn{min-height:39px;width:100%;padding:7px 10px;border:2px solid var(--line);border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;text-align:center}.category-sidebar .add-doc-btn{background:var(--blue);color:#fff}
.docs-list{flex:1;min-height:0;overflow-y:auto;padding:7px 0}
.doc-item{display:flex;align-items:center;justify-content:space-between;min-width:0;min-height:40px;margin:4px 0;padding:7px 9px;border:1.5px solid transparent;border-radius:8px;background:transparent;cursor:grab;user-select:none;transition:background .18s ease,border-color .18s ease,transform .18s ease}
.doc-item:active{cursor:grabbing}.doc-item:hover{background:var(--surface-2);transform:translateX(2px)}.doc-item.active{border-color:var(--line);background:var(--accent-soft);box-shadow:0 3px 8px rgba(40,27,43,.12)}
.doc-item.drag-over,.doc-block.drag-over{outline:2px dashed var(--blue);outline-offset:2px}.doc-title{flex:1;min-width:0;margin-right:6px;padding:2px 1px;border-radius:4px;color:var(--ink);font-size:12px;font-weight:650;cursor:pointer;pointer-events:auto}.doc-title:hover{color:var(--accent)}.doc-title .hint{margin-left:5px;color:var(--muted);font-size:10px}
.right-workspace{display:flex;flex:1;min-width:0;min-height:0;overflow:hidden}.main-doc-area{display:flex;flex:1;min-width:0;min-height:0;flex-direction:column;overflow:hidden;border:2px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.section-header{display:flex;flex:0 0 auto;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:10px 17px;border-bottom:2px solid var(--line);background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:850;line-height:1.25}.section-header button{min-width:36px;min-height:34px;padding:5px 9px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:750}.section-header button:hover{background:var(--secondary)}
.blocks-container{display:flex;flex:1;min-height:0;flex-direction:column;gap:8px;overflow:auto;padding:13px 18px 22px;overscroll-behavior:contain}
.doc-block{position:relative;border:1.5px solid var(--soft-line);border-radius:10px;background:var(--surface);transition:background-color .2s ease,border-color .2s ease;user-select:none}.doc-block:hover{border-color:var(--line)}.doc-block.locked{background:var(--surface-2)}
.block-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--soft-line);border-radius:8px 8px 0 0;background:var(--surface-2)}
.drag-handle{margin-right:7px;color:var(--muted);font-size:14px;cursor:grab;user-select:none}.drag-handle:active{cursor:grabbing}.block-title{display:flex;flex:1;align-items:center;gap:6px;min-width:0;color:var(--muted);font-size:12px;font-weight:750}
.block-title .block-name{min-width:60px;padding:3px 5px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--ink);cursor:text}.block-title .block-name:focus{border-color:var(--accent);outline:0;background:var(--surface);box-shadow:var(--focus)}
.block-actions{display:flex;gap:3px}.block-actions button{min-width:34px;width:34px;height:34px;padding:3px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:12px;pointer-events:auto}.block-actions button:hover{border-color:var(--line);background:var(--secondary);color:var(--ink)}
.block-content{min-height:72px;padding:11px 13px;outline:none;color:var(--ink);font-size:14px;line-height:1.72;user-select:text;overflow-wrap:anywhere}.block-content:focus{caret-color:var(--accent)}.block-content font[size="1"]{font-size:10px}.block-content font[size="2"]{font-size:12px}.block-content font[size="3"]{font-size:14px}.block-content font[size="4"]{font-size:16px}.block-content font[size="5"]{font-size:18px}.block-content font[size="6"]{font-size:24px}.block-content font[size="7"]{font-size:32px}
.doc-block.collapsed .block-content{display:none}.doc-block.locked .block-content{background:transparent;cursor:default}
.toast-message{position:fixed;bottom:24px;left:50%;z-index:999;transform:translateX(-50%);padding:9px 16px;border:1.5px solid var(--line);border-radius:9px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;box-shadow:var(--shadow);opacity:.96;pointer-events:none}
.ui-icon{display:inline-block;width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.context-menu .ui-icon{margin-right:2px}.toggle-collapse{position:relative;width:34px;min-width:34px}.toggle-collapse:before{content:"";display:block;width:7px;height:7px;margin:auto;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:translateY(-2px) rotate(45deg)}.toggle-collapse.is-collapsed:before{transform:translateY(2px) rotate(-45deg)}.lock-icon{position:relative;display:block;width:13px;height:10px;margin-top:4px;border:1.6px solid currentColor;border-radius:2px}.lock-icon:before{content:"";position:absolute;left:2px;top:-8px;width:6px;height:7px;border:1.6px solid currentColor;border-bottom:0;border-radius:7px 7px 0 0}.lock-block:not(.is-locked) .lock-icon:before{left:5px;border-left-color:transparent;border-radius:0 7px 0 0}.btn-underline{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.context-menu{position:fixed;z-index:10000;display:none;min-width:175px;padding:5px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);box-shadow:var(--shadow)}
.context-menu-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:6px;color:var(--ink);font-size:13px;cursor:pointer}.context-menu-item:hover{background:var(--accent-soft)}.context-menu-item .icon{font-size:15px}.context-menu-divider{height:1px;margin:4px 5px;background:var(--soft-line)}
.modal-overlay{position:fixed;inset:0;z-index:11000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(22,14,29,.52)}
.rename-dialog{width:min(420px,calc(100vw - 32px));padding:22px;border:2px solid var(--line);border-radius:15px;background:var(--surface);box-shadow:var(--shadow)}.rename-dialog h2{margin:0 0 14px;font-size:19px;font-weight:850}.rename-dialog input{width:100%;min-height:44px;padding:9px 11px;border:1.5px solid var(--soft-line);border-radius:8px;background:var(--surface);outline:none}.rename-dialog input:focus{border-color:var(--accent);box-shadow:var(--focus)}.rename-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.rename-dialog-actions button{min-width:76px}
.simple-mode .category-sidebar{display:none}body.workflow-mode .category-sidebar{background:var(--tertiary)}body.workflow-mode .workspace-switch:nth-child(1){background:var(--tertiary);color:#102c27}body.workflow-mode .section-header{background:var(--tertiary);color:#102c27}body.workflow-mode .doc-item.active{background:var(--secondary)}body.workflow-mode .add-doc-btn{background:var(--tertiary);color:#102c27}

<body>
<!-- 自定义右键菜单 -->
<div id="contextMenu" class="context-menu">
    <div class="context-menu-item" data-action="rename">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 5 5M4 20l4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10z"/></svg> 重命名
    </div>
    <div class="context-menu-item" data-action="move-category">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v10H3zM3 7V5h7l2 2"/></svg> 移至分类
    </div>
    <div class="context-menu-item" data-action="delete">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg> 删除文档
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" data-action="duplicate">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h11v13H8zM5 16H4V3h11v2"/></svg> 复制文档
    </div>
</div>
<div id="categoryContextMenu" class="context-menu">
    <div class="context-menu-item" data-category-action="rename"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 5 5M4 20l4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10z"/></svg> 重命名分类</div>
    <div class="context-menu-item" data-category-action="delete"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg> 删除分类</div>
</div>

<div class="workspace-switcher" role="tablist" aria-label="文档工具切换">
    <button id="simpleWorkspaceBtn" class="workspace-switch" type="button" role="tab" aria-selected="false">工作流</button>
    <button id="categorizedWorkspaceBtn" class="workspace-switch active" type="button" role="tab" aria-selected="true">文档记录</button>
</div>

<div class="toolbar">
    <div class="tool-group">
        <select id="fontFamilySelect" aria-label="字体" title="字体">
            <option value="system-ui">默认字体</option>
            <option value="Microsoft YaHei">微软雅黑</option>
            <option value="SimSun">宋体</option>
            <option value="FangSong">仿宋</option>
            <option value="KaiTi">楷体</option>
            <option value="SimHei">黑体</option>
            <option value="Arial">Arial</option>
        </select>
        <select id="fontSizeSelect" aria-label="字号" title="字号">
            <option value="1">10</option>
            <option value="2">12</option>
            <option value="3" selected>14</option>
            <option value="4">16</option>
            <option value="5">18</option>
            <option value="6">24</option>
            <option value="7">32</option>
        </select>
        <button id="unifiedTextStyleBtn" class="toolbar-action style-toggle" type="button" aria-pressed="false" title="按设定整理所有文档块标题和正文的字体与字号">一键整理字体</button>
        <button id="boldBtn" style="font-weight:600;">B</button>
        <button id="underlineBtn" class="btn-underline">U</button>
        <button id="colorOrangeBtn" class="color-orange">橙</button>
        <button id="colorBlueBtn" class="color-blue">蓝</button>
        <button id="colorBlackBtn" class="color-black">黑</button>
        <button id="colorDeepPurpleBtn" class="color-deep-purple">紫</button>
    </div>
    <div class="tool-group theme-tool-group"><label for="uiThemeSelect">主题</label><select id="uiThemeSelect" aria-label="界面主题"><option value="editorial">编辑部</option><option value="dopamine">多巴胺</option><option value="citrus">柠檬汽水</option><option value="blueprint">蓝晒蓝图</option><option value="night">夜色霓虹</option><option value="monochrome">黑白简约</option></select></div>
    <div class="separator"></div>
    <div class="tool-group">
        <button id="copyAllBtn" class="toolbar-action">复制主文档</button>
    </div>
    <div class="tool-group">
        <button id="backupBtn" class="toolbar-action">备份数据</button>
        <button id="importBtn" class="toolbar-action">导入数据</button>
        <button id="saveManualBtn" class="toolbar-action">手动保存</button>
    </div>
    <div style="font-size:11px; color:#64748b;">块内容可编辑字体与字号 · 支持拖拽排序 · 自动保存</div>
</div>

<div class="app-container" id="appContainer">
    <div class="category-sidebar"><div class="sidebar-header category-sidebar-header"><button id="addCategoryBtn" class="add-doc-btn" type="button" title="新建分类">+ 新建分类</button></div><div class="categories-list" id="categoriesListContainer"></div></div>
    <div class="docs-sidebar">
        <div class="sidebar-header">
            <button id="addDocBtn" class="add-doc-btn">+ 新建文档</button>
        </div>
        <div class="docs-list" id="docsListContainer"></div>
    </div>
    <div class="right-workspace">
        <div class="main-doc-area">
            <div class="section-header">
                <span id="mainDocCaption">主文档</span>
                <div><button id="toggleMainLock" type="button" title="锁定主文档" aria-label="锁定主文档" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 7-2M12 14v3"/></svg></button><button id="addMainBlockBtn" style="margin-left:6px;">+ 块</button></div>
            </div>
            <div id="mainBlocksContainer" class="blocks-container"></div>
        </div>
    </div>
</div>

<script>
    // ---------- 数据模型 ----------
    const LEGACY_STORAGE_KEY = 'multiDocManager_flat_v8';
    const STORAGE_KEYS = { simple: 'multiDocManager_simple_v1', categorized: 'multiDocManager_categorized_v1' };
    let workspaceMode = localStorage.getItem('multiDocManager_workspace_mode') === 'simple' ? 'simple' : 'categorized';
    let STORAGE_KEY = STORAGE_KEYS[workspaceMode];
    let documents = [];
    let categories = [];
    let currentCategoryId = null;
    let currentDocId = null;
    let autoSaveTimer = null;
    let blockDragSrcIndex = null;
    let contextMenuTargetDocId = null;
    let contextMenuTargetCategoryId = null;

    function generateId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 8); }
    function createBlock(content = "", title = "", collapsed = false, locked = false) {
        return { id: generateId(), content, title, collapsed, locked };
    }
    function createCategory(name) { return { id: generateId(), name }; }
    function createDocument(title, mainBlocks = [], categoryId = null) {
        if (mainBlocks.length === 0) mainBlocks = [createBlock("", "块")];
        return { id: generateId(), title, mainBlocks, categoryId, mainLocked: false };
    }

    function normalizeCategoryData() {
        if (!Array.isArray(categories)) categories = [];
        categories = categories.filter(c => c && c.name).map(c => ({ id: c.id || generateId(), name: String(c.name) }));
        if (!categories.length) categories = [createCategory("默认分类")];
        const validIds = new Set(categories.map(c => c.id));
        documents.forEach(doc => { if (!validIds.has(doc.categoryId)) doc.categoryId = categories[0].id; });
        const activeDoc = documents.find(doc => doc.id === currentDocId);
        if (activeDoc) currentCategoryId = activeDoc.categoryId;
        if (!validIds.has(currentCategoryId)) currentCategoryId = categories[0].id;
        if (!activeDoc || activeDoc.categoryId !== currentCategoryId) currentDocId = documents.find(doc => doc.categoryId === currentCategoryId)?.id || null;
    }

    function initializeWorkspaceStores() {
        const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
        if (!legacy) return;
        if (!localStorage.getItem(STORAGE_KEYS.categorized)) localStorage.setItem(STORAGE_KEYS.categorized, legacy);
        if (!localStorage.getItem(STORAGE_KEYS.simple)) localStorage.setItem(STORAGE_KEYS.simple, legacy);
    }

    function normalizeEditorHtml(html = '') {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = html;
        wrapper.querySelectorAll('style, link[rel="stylesheet"]').forEach(el => el.remove());
        return wrapper.innerHTML;
    }

    function normalizeDocuments() {
        documents.forEach(doc => {
            delete doc.styles;
            if (!Array.isArray(doc.mainBlocks)) doc.mainBlocks = [createBlock("", "块")];
            if (doc.mainLocked === undefined) doc.mainLocked = false;
            doc.mainBlocks.forEach(block => {
                if (block.collapsed === undefined) block.collapsed = false;
                if (block.locked === undefined) block.locked = false;
                if (block.title === undefined) block.title = "";
                block.content = normalizeEditorHtml(block.content || '');
            });
        });
        normalizeCategoryData();
    }

    function migrateOldData(data) {
        if (data.groups && Array.isArray(data.groups)) {
            categories = data.groups.map((group, index) => ({ id: group.id || generateId(), name: group.name || group.title || `分类 ${index + 1}` }));
            return data.groups.flatMap((group, index) => (group.documents || []).map(doc => ({ ...doc, categoryId: categories[index].id })));
        }
        return data.documents || [];
    }

    function initDefaultDocs() {
        categories = [createCategory("默认分类")];
        return [
            createDocument("计划模板", [createBlock("", "计划详情")], categories[0].id),
            createDocument("提示词示例", [createBlock("", "提示词1")], categories[0].id),
            createDocument("学习笔记", [createBlock("", "React基础")], categories[0].id)
        ];
    }

    function saveToLocalStorage(showMsg = false) {
        try {
            syncCurrentDocFromUI();
            normalizeCategoryData();
        const data = { documents, categories, currentCategoryId, currentDocId, version: 9 };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            if (showMsg) showToast("✓ 已保存", 1200);
        } catch(e) { console.warn(e); if(showMsg) showToast("保存失败",1200); }
    }

    function loadFromLocalStorage() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        try {
            const data = JSON.parse(raw);
            if ((data.version === 8 || data.version === 9) && data.documents) {
                documents = data.documents;
                categories = data.categories || [];
                currentCategoryId = data.currentCategoryId || null;
                currentDocId = data.currentDocId || (documents[0]?.id || null);
                normalizeDocuments();
                return true;
            } else if (data.groups) {
                const allDocs = migrateOldData(data);
                documents = allDocs;
                currentDocId = data.currentDocId || (documents[0]?.id || null);
                normalizeDocuments();
                return true;
            }
        } catch(e) {}
        return false;
    }

    function manualSave() { saveToLocalStorage(true); }
    function startAutoSave() {
        if (autoSaveTimer) clearInterval(autoSaveTimer);
        autoSaveTimer = setInterval(() => { syncCurrentDocFromUI(); saveToLocalStorage(false); }, 30000);
    }

    function syncCurrentDocFromUI() {
        if (!currentDocId) return;
        const doc = documents.find(d => d.id === currentDocId);
        if (!doc) return;
        const container = document.getElementById('mainBlocksContainer');
        if (container) {
            const blocks = container.querySelectorAll('.doc-block');
            doc.mainBlocks = Array.from(blocks).map(block => ({
                id: block.dataset.id,
                content: normalizeEditorHtml(block.querySelector('.block-content').innerHTML),
                title: block.querySelector('.block-name').innerText,
                collapsed: block.classList.contains('collapsed'),
                locked: block.classList.contains('locked')
            }));
        }
        doc.mainLocked = document.getElementById('toggleMainLock').getAttribute('aria-pressed') === 'true';
    }

    function getCurrentDocument() { return documents.find(d => d.id === currentDocId) || null; }

    // 渲染主文档块
    function iconSvg(name) {
        const paths = {
            lock: '<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',
            unlock: '<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 7-2M12 14v3"/>'
        };
        return '<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">' + paths[name] + '</svg>';
    }
    function renderMainBlocks(blocks) {
        const container = document.getElementById('mainBlocksContainer');
        if (!container) return;
        container.innerHTML = '';
        const doc = getCurrentDocument();
        const isMainLocked = doc ? doc.mainLocked : false;
        blocks.forEach((block, idx) => {
            const blockDiv = document.createElement('div');
            blockDiv.className = `doc-block ${block.collapsed ? 'collapsed' : ''} ${block.locked ? 'locked' : ''}`;
            blockDiv.dataset.id = block.id;
            blockDiv.dataset.index = idx;
            const header = document.createElement('div');
            header.className = 'block-header';
            header.innerHTML = `
                <div class="drag-handle" draggable="true" title="拖动调整顺序"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h.01M16 6h.01M8 12h.01M16 12h.01M8 18h.01M16 18h.01"/></svg></div>
                <div class="block-title">
                    <span class="block-name" contenteditable="true">${escapeHtml(block.title || '')}</span>
                </div>
                <div class="block-actions">
                    <button class="toggle-collapse ${block.collapsed ? 'is-collapsed' : ''}" type="button" title="${block.collapsed ? '展开' : '收起'}" aria-label="${block.collapsed ? '展开内容' : '收起内容'}"></button>
                    <button class="lock-block ${block.locked ? 'is-locked' : ''}" type="button" title="${block.locked ? '解锁内容' : '锁定内容'}" aria-label="${block.locked ? '解锁内容' : '锁定内容'}" aria-pressed="${block.locked}"><span class="lock-icon" aria-hidden="true"></span></button>
                    <button class="delete-block" type="button" title="删除内容块" aria-label="删除内容块"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
                </div>
            `;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'block-content';
            contentDiv.contentEditable = (!block.locked && !isMainLocked).toString();
            block.content = normalizeEditorHtml(block.content || '');
            contentDiv.innerHTML = block.content;
            contentDiv.addEventListener('input', () => { syncCurrentDocFromUI(); saveToLocalStorage(false); });
            contentDiv.addEventListener('focus', () => { activeEditorElement = contentDiv; });
            const blockNameSpan = header.querySelector('.block-name');
            blockNameSpan.addEventListener('blur', () => {
                const newTitle = blockNameSpan.innerText.trim();
                if (newTitle !== block.title) {
                    block.title = newTitle;
                    syncCurrentDocFromUI();
                    saveToLocalStorage(false);
                }
            });
            blockNameSpan.addEventListener('click', e => e.stopPropagation());
            blockDiv.appendChild(header);
            blockDiv.appendChild(contentDiv);
            // 按钮事件
            const toggleBtn = header.querySelector('.toggle-collapse');
            toggleBtn.onclick = (e) => {
                e.stopPropagation();
                block.collapsed = !block.collapsed;
                blockDiv.classList.toggle('collapsed');
                toggleBtn.classList.toggle('is-collapsed', block.collapsed);
                toggleBtn.title = block.collapsed ? '展开' : '收起';
                toggleBtn.setAttribute('aria-label', block.collapsed ? '展开内容' : '收起内容');
                syncCurrentDocFromUI();
                saveToLocalStorage(false);
            };
            const lockBtn = header.querySelector('.lock-block');
            lockBtn.onclick = (e) => {
                e.stopPropagation();
                block.locked = !block.locked;
                blockDiv.classList.toggle('locked');
                lockBtn.classList.toggle('is-locked', block.locked);
                lockBtn.setAttribute('aria-pressed', String(block.locked));
                lockBtn.title = block.locked ? '解锁内容' : '锁定内容';
                lockBtn.setAttribute('aria-label', lockBtn.title);
                contentDiv.contentEditable = (!block.locked && !isMainLocked).toString();
                syncCurrentDocFromUI();
                saveToLocalStorage(false);
                showToast(block.locked ? "块已锁定" : "块已解锁", 1000);
            };
            const delBtn = header.querySelector('.delete-block');
            delBtn.onclick = (e) => {
                e.stopPropagation();
                if (confirm("删除此块？")) {
                    const doc = getCurrentDocument();
                    if (doc) {
                        doc.mainBlocks = doc.mainBlocks.filter(b => b.id !== block.id);
                        renderCurrentDocument();
                        syncCurrentDocFromUI();
                        saveToLocalStorage(false);
                        showToast("已删除块", 1000);
                    }
                }
            };
            // 拖拽手柄
            const dragHandle = header.querySelector('.drag-handle');
            dragHandle.addEventListener('dragstart', (e) => {
                blockDragSrcIndex = idx;
                e.dataTransfer.setData('text/plain', idx);
                e.dataTransfer.effectAllowed = 'move';
                dragHandle.style.opacity = '0.5';
            });
            dragHandle.addEventListener('dragend', (e) => {
                dragHandle.style.opacity = '';
                document.querySelectorAll('.doc-block').forEach(el => el.classList.remove('drag-over'));
                blockDragSrcIndex = null;
            });
            blockDiv.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const target = e.target.closest('.doc-block');
                if (target && blockDragSrcIndex !== null) target.classList.add('drag-over');
            });
            blockDiv.addEventListener('drop', (e) => {
                e.preventDefault();
                const targetBlock = e.target.closest('.doc-block');
                if (targetBlock && blockDragSrcIndex !== null) {
                    const targetIdx = parseInt(targetBlock.dataset.index);
                    if (blockDragSrcIndex !== targetIdx) {
                        const [moved] = blocks.splice(blockDragSrcIndex, 1);
                        blocks.splice(targetIdx, 0, moved);
                        renderMainBlocks(blocks);
                        syncCurrentDocFromUI();
                        saveToLocalStorage(false);
                        showToast("块顺序已更新", 1000);
                    }
                }
                document.querySelectorAll('.doc-block').forEach(el => el.classList.remove('drag-over'));
                blockDragSrcIndex = null;
            });
            container.appendChild(blockDiv);
        });
    }

    function renderCurrentDocument() {
        const doc = getCurrentDocument();
        if (!doc) {
            document.getElementById('mainBlocksContainer').innerHTML = '';
            document.getElementById('mainDocCaption').textContent = '请选择或新建文档';
            document.getElementById('toggleMainLock').innerHTML = iconSvg('unlock');
            document.getElementById('toggleMainLock').setAttribute('aria-pressed', 'false');
            return;
        }
        const category = categories.find(c => c.id === doc.categoryId);
        document.getElementById('mainDocCaption').textContent = `${workspaceMode === 'categorized' && category ? category.name + ' / ' : ''}${doc.title}`;
        renderMainBlocks(doc.mainBlocks);
        document.getElementById('toggleMainLock').innerHTML = iconSvg(doc.mainLocked ? 'lock' : 'unlock');
        document.getElementById('toggleMainLock').setAttribute('aria-pressed', String(doc.mainLocked));
        document.getElementById('toggleMainLock').title = doc.mainLocked ? '解锁主文档' : '锁定主文档';
        document.querySelectorAll('#mainBlocksContainer .block-content').forEach(el => {
            const blockDiv = el.closest('.doc-block');
            const isBlockLocked = blockDiv.classList.contains('locked');
            el.contentEditable = (!isBlockLocked && !doc.mainLocked).toString();
        });
    }

    // ----- 右键菜单 -----
    function showContextMenu(e, docId) {
        e.preventDefault();
        contextMenuTargetDocId = docId;
        const menu = document.getElementById('contextMenu');
        menu.style.display = 'block';
        let x = e.clientX;
        let y = e.clientY;
        const menuWidth = 180;
        const menuHeight = 180;
        if (x + menuWidth > window.innerWidth) x = window.innerWidth - menuWidth - 10;
        if (y + menuHeight > window.innerHeight) y = window.innerHeight - menuHeight - 10;
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
    }

    function hideContextMenu() {
        document.getElementById('contextMenu').style.display = 'none';
        document.getElementById('categoryContextMenu').style.display = 'none';
        contextMenuTargetDocId = null;
        contextMenuTargetCategoryId = null;
    }

    function showCategoryContextMenu(e, categoryId) {
        e.preventDefault();
        e.stopPropagation();
        hideContextMenu();
        contextMenuTargetCategoryId = categoryId;
        const menu = document.getElementById('categoryContextMenu');
        const x = Math.min(e.clientX, window.innerWidth - 190);
        const y = Math.min(e.clientY, window.innerHeight - 100);
        menu.style.left = Math.max(8, x) + 'px';
        menu.style.top = Math.max(8, y) + 'px';
        menu.style.display = 'block';
    }

    function handleCategoryContextMenuAction(action) {
        const category = categories.find(item => item.id === contextMenuTargetCategoryId);
        if (!category) return hideContextMenu();
        const item = Array.from(document.querySelectorAll('#categoriesListContainer .category-item')).find(node => node.dataset.id === category.id);
        hideContextMenu();
        if (action === 'rename' && item) {
            beginInlineNameEdit(item, category.name, name => {
                category.name = name;
                renderCategoryList();
                renderCurrentDocument();
                saveToLocalStorage(false);
            });
            return;
        }
        if (action !== 'delete') return;
        if (categories.length < 2) { showToast('至少保留一个分类'); return; }
        if (!confirm(`删除分类“${category.name}”？其中的文档会移到其他分类。`)) return;
        const replacement = categories.find(item => item.id !== category.id);
        documents.forEach(doc => { if (doc.categoryId === category.id) doc.categoryId = replacement.id; });
        categories = categories.filter(item => item.id !== category.id);
        if (currentCategoryId === category.id) currentCategoryId = replacement.id;
        if (!documents.some(doc => doc.id === currentDocId)) currentDocId = documents.find(doc => doc.categoryId === currentCategoryId)?.id || null;
        renderCategoryList();
        renderDocList();
        renderCurrentDocument();
        saveToLocalStorage(false);
    }

    function handleContextMenuAction(action) {
        if (!contextMenuTargetDocId) return;
        const doc = documents.find(d => d.id === contextMenuTargetDocId);
        if (!doc) return;
        const idx = documents.indexOf(doc);

        switch(action) {
            case 'rename': {
                hideContextMenu();
                const item = Array.from(document.querySelectorAll('#docsListContainer .doc-item')).find(node => node.dataset.id === doc.id);
                const title = item?.querySelector('.doc-title');
                if (title) beginInlineNameEdit(title, doc.title, newTitle => {
                    doc.title = newTitle;
                    renderDocList();
                    if (currentDocId === doc.id) renderCurrentDocument();
                    saveToLocalStorage(false);
                });
                return;
            }
            case 'delete': {
                if (documents.length === 1) {
                    showToast("至少保留一个文档");
                    break;
                }
                if (!confirm(`确定要删除文档 "${doc.title}" 吗？`)) break;
                documents.splice(idx, 1);
                if (currentDocId === doc.id) {
                    currentDocId = documents.find(item => item.categoryId === currentCategoryId)?.id || null;
                    renderCurrentDocument();
                }
                renderDocList();
                saveToLocalStorage(false);
                showToast("已删除文档", 1000);
                break;
            }
            case 'move-category': {
                if (categories.length < 2) { showToast('请先新建一个分类'); break; }
                const options = categories.map((category, index) => `${index + 1}. ${category.name}`).join('\n');
                const choice = Number(prompt(`输入要移入的分类序号：\n${options}`));
                const destination = categories[choice - 1];
                if (!destination) { showToast('分类序号无效'); break; }
                doc.categoryId = destination.id;
                if (currentDocId === doc.id) currentCategoryId = destination.id;
                renderCategoryList();
                renderDocList();
                renderCurrentDocument();
                saveToLocalStorage(false);
                showToast(`已将文档移入：${destination.name}`);
                break;
            }
            case 'duplicate': {
                const newDoc = JSON.parse(JSON.stringify(doc));
                newDoc.id = generateId();
                newDoc.title = doc.title + ' (副本)';
                documents.push(newDoc);
                renderDocList();
                saveToLocalStorage(false);
                showToast(`已复制文档: ${newDoc.title}`, 1000);
                break;
            }
        }
        hideContextMenu();
    }

    // ----- 文档列表渲染（无删除按钮）-----
    function beginInlineNameEdit(element, oldName, onSave) {
        if (!element || !element.isConnected) return;
        const input = document.createElement('input');
        input.className = 'inline-name-editor';
        input.type = 'text';
        input.value = oldName;
        let finished = false;
        const finish = commit => {
            if (finished) return;
            const newName = input.value.trim();
            if (commit && newName) {
                finished = true;
                onSave(newName);
                return;
            }
            if (commit && !newName) showToast('名称不能为空', 1200);
            finished = true;
            input.replaceWith(element);
        };
        input.addEventListener('keydown', event => {
            if (event.key === 'Enter') { event.preventDefault(); finish(true); }
            if (event.key === 'Escape') { event.preventDefault(); finish(false); }
        });
        input.addEventListener('blur', () => finish(true));
        input.addEventListener('click', event => event.stopPropagation());
        element.replaceWith(input);
        input.focus();
        input.select();
    }

    function renderCategoryList() {
        const container = document.getElementById('categoriesListContainer');
        if (!container) return;
        container.innerHTML = '';
        categories.forEach(category => {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = `category-item ${category.id === currentCategoryId ? 'active' : ''}`;
            item.dataset.id = category.id;
            item.textContent = category.name;
            item.title = '单击切换分类，双击直接修改名称，右键重命名或删除';
            item.addEventListener('click', () => {
                if (category.id === currentCategoryId) return;
                syncCurrentDocFromUI();
                currentCategoryId = category.id;
                container.querySelectorAll('.category-item').forEach(node => node.classList.toggle('active', node.dataset.id === category.id));
                const docsInCategory = documents.filter(doc => doc.categoryId === category.id);
                if (!docsInCategory.some(doc => doc.id === currentDocId)) currentDocId = docsInCategory[0]?.id || null;
                renderDocList();
                renderCurrentDocument();
                saveToLocalStorage(false);
            });
            item.addEventListener('dblclick', e => {
                e.preventDefault();
                e.stopPropagation();
                beginInlineNameEdit(item, category.name, name => {
                    category.name = name;
                    renderCategoryList();
                    renderCurrentDocument();
                    saveToLocalStorage(false);
                });
            });
            item.addEventListener('contextmenu', e => showCategoryContextMenu(e, category.id));
            container.appendChild(item);
        });
    }

    function addCategory() {
        syncCurrentDocFromUI();
        let number = categories.length + 1;
        while (categories.some(item => item.name === `新分类 ${number}`)) number++;
        const category = createCategory(`新分类 ${number}`);
        categories.push(category);
        currentCategoryId = category.id;
        currentDocId = null;
        renderCategoryList();
        renderDocList();
        renderCurrentDocument();
        saveToLocalStorage(false);
        showToast(`已创建分类：${category.name}`);
    }

    function renderDocList() {
        const container = document.getElementById('docsListContainer');
        if (!container) return;
        container.innerHTML = '';
        const visibleDocs = workspaceMode === 'simple' ? documents : documents.filter(doc => doc.categoryId === currentCategoryId);
        if (!visibleDocs.length) {
            const empty = document.createElement('div');
            empty.className = 'category-empty';
            empty.textContent = '此分类暂无文档';
            container.appendChild(empty);
        }
        visibleDocs.forEach(doc => {
            const idx = documents.indexOf(doc);
            const div = document.createElement('div');
            div.className = `doc-item ${currentDocId === doc.id ? 'active' : ''}`;
            div.setAttribute('data-id', doc.id);
            div.setAttribute('data-index', idx);
            div.setAttribute('draggable', 'true');

            // 文档标题
            const titleSpan = document.createElement('span');
            titleSpan.className = 'doc-title';
            titleSpan.textContent = doc.title;
            titleSpan.title = '单击打开，双击直接修改名称；右键管理';

            // 右键菜单
            titleSpan.addEventListener('contextmenu', (e) => {
                e.stopPropagation();
                showContextMenu(e, doc.id);
            });
            div.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                showContextMenu(e, doc.id);
            });

            // 单击选择文档
            titleSpan.addEventListener('click', (e) => {
                e.stopPropagation();
                selectDocument(doc.id);
            });
            titleSpan.addEventListener('dblclick', (e) => {
                e.preventDefault();
                e.stopPropagation();
                beginInlineNameEdit(titleSpan, doc.title, newTitle => {
                    doc.title = newTitle;
                    renderDocList();
                    if (currentDocId === doc.id) renderCurrentDocument();
                    saveToLocalStorage(false);
                });
            });

            div.appendChild(titleSpan);

            // 点击文档项空白区域选择文档
            div.addEventListener('click', (e) => {
                if (e.target === div) {
                    selectDocument(doc.id);
                }
            });

            // 拖拽排序
            div.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', idx);
                div.style.opacity = '0.5';
            });
            div.addEventListener('dragend', (e) => {
                div.style.opacity = '';
                document.querySelectorAll('.doc-item').forEach(i => i.classList.remove('drag-over'));
            });
            div.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const target = e.target.closest('.doc-item');
                if (target) target.classList.add('drag-over');
            });
            div.addEventListener('drop', (e) => {
                e.preventDefault();
                const targetIdx = parseInt(e.target.closest('.doc-item')?.getAttribute('data-index'));
                const srcIdx = parseInt(e.dataTransfer.getData('text/plain'));
                if (!isNaN(targetIdx) && srcIdx !== targetIdx) {
                    const [moved] = documents.splice(srcIdx, 1);
                    documents.splice(targetIdx, 0, moved);
                    renderDocList();
                    saveToLocalStorage(false);
                    showToast('文档顺序已更新', 1000);
                }
                document.querySelectorAll('.doc-item').forEach(i => i.classList.remove('drag-over'));
            });
            container.appendChild(div);
        });
    }

    function addDocument() {
        const newTitle = `文档 ${documents.length + 1}`;
        const newDoc = createDocument(newTitle, [createBlock("", "")], currentCategoryId);
        documents.push(newDoc);
        renderDocList();
        selectDocument(newDoc.id);
        saveToLocalStorage(false);
        showToast(`已创建: ${newTitle}`);
    }

    function animateDocumentSwitch() {
        const container = document.getElementById('mainBlocksContainer');
        if (!container || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        container.animate(
            [{ opacity: 0.45, transform: 'translateY(5px)' }, { opacity: 1, transform: 'translateY(0)' }],
            { duration: 180, easing: 'cubic-bezier(0.2, 0.7, 0.2, 1)' }
        );
    }

    function selectDocument(docId) {
        if (currentDocId === docId) return;
        syncCurrentDocFromUI();
        currentDocId = docId;
        currentCategoryId = documents.find(doc => doc.id === docId)?.categoryId || currentCategoryId;
        renderCategoryList();
        renderDocList();
        renderCurrentDocument();
        animateDocumentSwitch();
        applyUnifiedTextStyle(unifiedTextStyle, false);
        saveToLocalStorage(false);
    }

    function addMainBlock() {
        const doc = getCurrentDocument();
        if (!doc) return;
        const newTitle = `块 ${doc.mainBlocks.length + 1}`;
        const newBlock = createBlock("", newTitle);
        doc.mainBlocks.push(newBlock);
        renderCurrentDocument();
        syncCurrentDocFromUI();
        saveToLocalStorage(false);
        showToast("已添加新块", 1000);
    }

    function toggleMainLock() {
        const doc = getCurrentDocument();
        if (doc) {
            doc.mainLocked = !doc.mainLocked;
            renderCurrentDocument();
            syncCurrentDocFromUI();
            saveToLocalStorage(false);
            showToast(doc.mainLocked ? "主文档已锁定" : "主文档已解锁", 1000);
        }
    }

    function copyMainText() {
        const doc = getCurrentDocument();
        if (!doc) return;
        let text = '';
        doc.mainBlocks.forEach(block => {
            const title = block.title || "未命名块";
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = block.content;
            const contentText = tempDiv.innerText.trim();
            text += `【${title}】\n`;
            if (contentText) text += contentText + '\n\n';
            else text += '\n\n';
        });
        navigator.clipboard.writeText(text).then(() => showToast("已复制主文档内容（含块标题）", 1500)).catch(() => {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast("已复制主文档内容（含块标题）", 1500);
        });
    }

    let activeEditorElement = null;
    let savedEditorRange = null;
    document.addEventListener('selectionchange', () => {
        const selection = window.getSelection();
        if (!activeEditorElement || !selection || !selection.rangeCount) return;
        const range = selection.getRangeAt(0);
        if (activeEditorElement.contains(range.startContainer) && activeEditorElement.contains(range.endContainer)) {
            savedEditorRange = range.cloneRange();
        }
    });
    function execOnActive(cmd, value) {
        if (activeEditorElement && activeEditorElement.isContentEditable) {
            activeEditorElement.focus();
            if (savedEditorRange && activeEditorElement.contains(savedEditorRange.startContainer) && activeEditorElement.contains(savedEditorRange.endContainer)) {
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(savedEditorRange);
            }
            document.execCommand(cmd, false, value);
            const selection = window.getSelection();
            if (selection && selection.rangeCount && activeEditorElement.contains(selection.anchorNode)) {
                savedEditorRange = selection.getRangeAt(0).cloneRange();
            }
            syncCurrentDocFromUI();
            saveToLocalStorage(false);
        } else {
            showToast("请先点击要编辑的块内容", 1000);
        }
    }

    function showToast(msg, duration=1500) {
        const t = document.querySelector('.toast-message');
        if(t) t.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(()=>toast.remove(), duration);
    }

    function createDefaultWorkspaceSnapshot() {
        const category = createCategory("默认分类");
        const docs = [
            createDocument("计划模板", [createBlock("", "计划详情")], category.id),
            createDocument("提示词示例", [createBlock("", "提示词1")], category.id),
            createDocument("学习笔记", [createBlock("", "React基础")], category.id)
        ];
        return { documents: docs, categories: [category], currentCategoryId: category.id, currentDocId: docs[0].id, version: 9 };
    }

    async function backupData() {
        saveToLocalStorage(false);
        initializeWorkspaceStores();
        const workspaces = {};
        for (const mode of ['simple', 'categorized']) {
            const raw = localStorage.getItem(STORAGE_KEYS[mode]);
            workspaces[mode] = raw ? JSON.parse(raw) : createDefaultWorkspaceSnapshot();
            if (!raw) localStorage.setItem(STORAGE_KEYS[mode], JSON.stringify(workspaces[mode]));
        }
        const data = { format: 'multi-document-workspaces', version: 1, activeWorkspace: workspaceMode, workspaces };
        const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
        const backupTime = new Date();
        const backupTimestamp = [backupTime.getFullYear(), String(backupTime.getMonth() + 1).padStart(2, '0'), String(backupTime.getDate()).padStart(2, '0'), '_', String(backupTime.getHours()).padStart(2, '0'), String(backupTime.getMinutes()).padStart(2, '0'), String(backupTime.getSeconds()).padStart(2, '0')].join('');
        const fileName = `文档记录${backupTimestamp}.json`;
        try {
            if (window.showSaveFilePicker) {
                const handle = await window.showSaveFilePicker({
                    suggestedName: fileName,
                    types: [{ description: 'JSON 备份文件', accept: { 'application/json': ['.json'] } }]
                });
                const writable = await handle.createWritable();
                await writable.write(blob);
                await writable.close();
            } else if (window.showDirectoryPicker) {
                const directory = await window.showDirectoryPicker({ mode: 'readwrite' });
                const handle = await directory.getFileHandle(fileName, { create: true });
                const writable = await handle.createWritable();
                await writable.write(blob);
                await writable.close();
            } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                showToast("当前浏览器不支持选择位置，已按默认下载设置保存", 2200);
                return;
            }
            showToast("工作流与文档记录已保存到所选位置", 1800);
        } catch (err) {
            if (err.name === 'AbortError') return;
            console.warn('备份保存失败', err);
            showToast("保存失败，请检查文件夹权限后重试", 2000);
        }
    }

    function importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json';
        input.onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (data.format === 'multi-document-workspaces' && data.version === 1 && data.workspaces) {
                        const modes = ['simple', 'categorized'];
                        const valid = modes.every(mode => {
                            const workspace = data.workspaces[mode];
                            return workspace && Array.isArray(workspace.documents) && Array.isArray(workspace.categories);
                        });
                        if (!valid) { showToast("无效备份：缺少工作区数据", 1800); return; }
                        for (const mode of modes) localStorage.setItem(STORAGE_KEYS[mode], JSON.stringify(data.workspaces[mode]));
                        workspaceMode = modes.includes(data.activeWorkspace) ? data.activeWorkspace : workspaceMode;
                        STORAGE_KEY = STORAGE_KEYS[workspaceMode];
                        localStorage.setItem('multiDocManager_workspace_mode', workspaceMode);
                        documents = [];
                        categories = [];
                        currentCategoryId = null;
                        currentDocId = null;
                        loadFromLocalStorage();
                        normalizeDocuments();
                        updateWorkspaceModeUI();
                        unifiedTextStyle = readUnifiedTextStyle(workspaceMode);
                        applyUnifiedTextStyle(unifiedTextStyle, false);
                        renderCategoryList();
                        renderDocList();
                        renderCurrentDocument();
                        showToast("工作流与文档记录已全部恢复", 1800);
                    } else if ((data.version === 8 || data.version === 9) && data.documents) {
                        documents = data.documents;
                        categories = data.categories || [];
                        currentCategoryId = data.currentCategoryId || null;
                        currentDocId = data.currentDocId || (documents[0]?.id || null);
                        normalizeDocuments();
                        renderCategoryList();
                        renderDocList();
                        renderCurrentDocument();
                        saveToLocalStorage(false);
                        showToast("导入成功", 1500);
                    } else if (data.groups) {
                        const allDocs = migrateOldData(data);
                        documents = allDocs;
                        currentCategoryId = null;
                        currentDocId = data.currentDocId || (documents[0]?.id || null);
                        normalizeDocuments();
                        renderCategoryList();
                        renderDocList();
                        renderCurrentDocument();
                        saveToLocalStorage(false);
                        showToast("导入成功（旧格式已转换）", 1500);
                    } else {
                        showToast("无效备份", 1500);
                    }
                } catch(err) { showToast("解析失败", 1500); }
            };
            reader.readAsText(file);
        };
        input.click();
    }

    function unifiedTextStyleKey(mode = workspaceMode) { return `workflow-unified-text-style-${mode}`; }
    function readUnifiedTextStyle(mode = workspaceMode) {
        const value = localStorage.getItem(unifiedTextStyleKey(mode));
        return value === null ? localStorage.getItem('workflow-unified-text-style') === '1' : value === '1';
    }
    let unifiedTextStyle = readUnifiedTextStyle();
    function applyUnifiedTextStyle(enabled, notify = true) {
        unifiedTextStyle = enabled;
        document.body.classList.toggle('unified-text-style', enabled);
        localStorage.setItem(unifiedTextStyleKey(), enabled ? '1' : '0');
        const button = document.getElementById('unifiedTextStyleBtn');
        if (button) {
            button.setAttribute('aria-pressed', String(enabled));
            button.textContent = enabled ? '字体已整理 ✓' : '一键整理字体';
        }
        if (notify && enabled) showToast('已将所有标题统一为加粗苹方 14 号、正文统一为苹方 14 号', 1500);
    }
    function updateWorkspaceModeUI() {
        const simple = workspaceMode === 'simple';
        document.getElementById('appContainer').classList.toggle('simple-mode', simple);
        document.body.classList.toggle('workflow-mode', simple);
        const simpleButton = document.getElementById('simpleWorkspaceBtn');
        const categorizedButton = document.getElementById('categorizedWorkspaceBtn');
        simpleButton.classList.toggle('active', simple);
        categorizedButton.classList.toggle('active', !simple);
        simpleButton.setAttribute('aria-selected', String(simple));
        categorizedButton.setAttribute('aria-selected', String(!simple));
    }

    function switchWorkspace(mode) {
        if (mode === workspaceMode) return;
        saveToLocalStorage(false);
        workspaceMode = mode;
        STORAGE_KEY = STORAGE_KEYS[mode];
        localStorage.setItem('multiDocManager_workspace_mode', mode);
        documents = [];
        categories = [];
        currentCategoryId = null;
        currentDocId = null;
        const loaded = loadFromLocalStorage();
        if (!loaded || !documents.length) {
            documents = initDefaultDocs();
            currentCategoryId = categories[0]?.id || null;
            currentDocId = documents[0]?.id || null;
        }
        normalizeCategoryData();
        updateWorkspaceModeUI();
        renderCategoryList();
        renderDocList();
        renderCurrentDocument();
        unifiedTextStyle = readUnifiedTextStyle(mode);
        applyUnifiedTextStyle(unifiedTextStyle, false);
        saveToLocalStorage(false);
    }

    const UI_THEME_KEY = 'workflow-ui-theme-v1';
    const UI_THEME_COLORS = { editorial: '#fff8ef', dopamine: '#fff3fc', citrus: '#f7fbdc', blueprint: '#eaf1ff', night: '#191526', monochrome: '#f2f2f0' };
    function applyUITheme(theme) {
        const allowed = Object.prototype.hasOwnProperty.call(UI_THEME_COLORS, theme) ? theme : 'editorial';
        document.body.dataset.theme = allowed;
        localStorage.setItem(UI_THEME_KEY, allowed);
        const select = document.getElementById('uiThemeSelect');
        if (select) select.value = allowed;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = UI_THEME_COLORS[allowed];
    }
    function init() {
        applyUITheme(localStorage.getItem(UI_THEME_KEY) || 'editorial');
        initializeWorkspaceStores();
        const loaded = loadFromLocalStorage();
        if (!loaded || !documents.length) {
            documents = initDefaultDocs();
            currentDocId = documents[0].id;
            currentCategoryId = categories[0]?.id || null;
        }
        normalizeCategoryData();
        updateWorkspaceModeUI();
        renderCategoryList();
        renderDocList();
        renderCurrentDocument();
        applyUnifiedTextStyle(unifiedTextStyle, false);

        document.getElementById('uiThemeSelect').addEventListener('change', event => applyUITheme(event.target.value));
        document.getElementById('addDocBtn').addEventListener('click', addDocument);
        document.getElementById('addCategoryBtn').addEventListener('click', addCategory);
        document.getElementById('simpleWorkspaceBtn').addEventListener('click', () => switchWorkspace('simple'));
        document.getElementById('categorizedWorkspaceBtn').addEventListener('click', () => switchWorkspace('categorized'));
        document.getElementById('toggleMainLock').addEventListener('click', toggleMainLock);
        document.getElementById('addMainBlockBtn').addEventListener('click', addMainBlock);
        document.getElementById('copyAllBtn').addEventListener('click', copyMainText);
        document.getElementById('backupBtn').addEventListener('click', backupData);
        document.getElementById('importBtn').addEventListener('click', importData);
        document.getElementById('saveManualBtn').addEventListener('click', manualSave);
        document.getElementById('boldBtn').addEventListener('click', () => execOnActive('bold'));
        document.getElementById('underlineBtn').addEventListener('click', () => execOnActive('underline'));
        document.getElementById('fontFamilySelect').addEventListener('change', e => execOnActive('fontName', e.target.value));
        document.getElementById('fontSizeSelect').addEventListener('change', e => execOnActive('fontSize', e.target.value));
        document.getElementById('unifiedTextStyleBtn').addEventListener('click', () => applyUnifiedTextStyle(true));
        document.getElementById('colorOrangeBtn').addEventListener('click', () => execOnActive('foreColor', '#ad7865'));
        document.getElementById('colorBlueBtn').addEventListener('click', () => execOnActive('foreColor', '#71899a'));
        document.getElementById('colorBlackBtn').addEventListener('click', () => execOnActive('foreColor', '#52545a'));
        document.getElementById('colorDeepPurpleBtn').addEventListener('click', () => execOnActive('foreColor', '#897a96'));
        // 右键菜单事件
        document.querySelectorAll('#contextMenu .context-menu-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                handleContextMenuAction(item.dataset.action);
            });
        });
        document.querySelectorAll('#categoryContextMenu .context-menu-item').forEach(item => {
            item.addEventListener('click', e => {
                e.preventDefault();
                e.stopPropagation();
                handleCategoryContextMenuAction(item.dataset.categoryAction);
            });
        });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#contextMenu, #categoryContextMenu')) {
                hideContextMenu();
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideContextMenu();
            }
        });

        startAutoSave();
        window.addEventListener('beforeunload', () => { syncCurrentDocFromUI(); saveToLocalStorage(false); });
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':m); }

    init();

    if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .catch(error => console.warn('离线缓存注册失败', error));
        });
    }
</script>
